buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7.38'
    }
}

plugins {
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

apply plugin: 'org.spongepowered.mixin'

version = '3.4.3'
group = 'net.erutobusiness'
base { archivesName = 'dynamicwaters_asyncrivers' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

minecraft {
    mappings channel: 'official', version: '1.20.1'
}

mixin {
    add sourceSets.main, 'asyncrivers.refmap.json'
    config 'asyncrivers.mixins.json'
}

repositories {
    // MOD の依存を取る maven。手元に jar を置かずに済ませるため（2026-08-07）
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    // Mixin のターゲット解決用。実行時は同梱しない（利用者が入れている本体に当てる）
    compileOnly "maven.modrinth:dynamic-waters-realistic-flowing-rivers:11.1.2.HOTFIXED"
}

jar {
    manifest {
        attributes([
            'Specification-Title'   : 'dynamicwaters_asyncrivers',
            'Specification-Version' : '1',
            'Implementation-Title'  : 'Dynamic Waters Async Rivers',
            'Implementation-Version': project.version,
            'MixinConfigs'          : 'asyncrivers.mixins.json'
        ])
    }
}
