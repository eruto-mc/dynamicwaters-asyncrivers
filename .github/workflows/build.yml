name: build

# ⚠ **JDK は 17。21 にしない。**
#    Minecraft 1.20.1 / Forge 47 は Java 17 で動き、各 build.gradle も
#    `JavaLanguageVersion.of(17)` で固定している。さらに ForgeGradle は
#    `[6.0.24,6.2)` で、6.0 系は JDK 21 上で動かすと壊れる。
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # PR で gradle-wrapper.jar を差し替える攻撃を弾く
      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: jar
          path: build/libs/*.jar
          if-no-files-found: error

      # タグを打ったときだけリリースを作る（jar を添付する）
      - name: release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" build/libs/*.jar --generate-notes
